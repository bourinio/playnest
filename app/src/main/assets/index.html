function tr(k){return I[st.lang][k]||k}function ix(){return st.lang==='el'?0:1}function title(a){return st.lang==='el'?a.titleEl:a.titleEn}function desc(a){return st.lang==='el'?a.descEl:a.descEn}function mats(a){return st.lang==='el'?a.materialsEl:a.materialsEn}function skills(a){return st.lang==='el'?a.skillsEl:a.skillsEn}function steps(a){return st.lang==='el'?a.stepsEl:a.stepsEn}
function save(){storageSet('pn_lang',st.lang);storageSet('pn_profile',JSON.stringify(st.profile));storageSet('pn_favs',JSON.stringify(st.favs));storageSet('pn_week',JSON.stringify(st.week));storageSet('pn_done',JSON.stringify(st.done))}function toast(x){let e=document.getElementById('toast');e.textContent=x;e.style.display='block';setTimeout(()=>e.style.display='none',1300)}

<script>
let exType='all';
function addExploreButton(){

<script>
function ensureExploreTags(){
  activities.forEach(a=>{
    if(!a.tags) a.tags=[];
    const add=t=>{if(!a.tags.includes(t))a.tags.push(t)};
    if(a.types?.includes('creative')) add('creative');
    if(a.types?.includes('learning')) add('learning');
    if(a.types?.includes('movement')) add('active');
    if(a.types?.includes('calm')) add('calm');
    if(a.titleEl?.toLowerCase().includes('επιστήμον') || a.titleEn?.toLowerCase().includes('scientist') || a.emoji==='🔬') add('stem');
    if(a.places?.includes('outside')) add('outdoor');
    if(a.places?.includes('car')) add('travel');
    if(a.places?.includes('restaurant')) add('restaurant');
    if(a.ages?.some(x=>x==='1-2'||x==='2-3')) add('toddler');
    if(a.titleEl?.toLowerCase().includes('οικογεν') || a.titleEn?.toLowerCase().includes('family') || a.emoji==='👨‍👩‍👧') add('family');
    // Most PlayNest activities are screen-free unless explicitly digital.
    add('screenfree');
    // Derive rainy-day from indoor calm/creative/learning activities.
    if(a.places?.includes('home') && (a.types?.includes('creative')||a.types?.includes('calm')||a.types?.includes('learning'))) add('rainy');
  });
}
</script>

emplate-columns:1fr 1fr;gap:10px}.pack{border:0;border-radius:20px;padding:16px;text-align:left;background:#f7fbfb;min-height:110px}.pack b{display:block;margin-top:8px}.challengeDay{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;border-bottom:1px solid #eef2f2;padding:10px 0}.challengeDay:last-child{border-bottom:0}.progressBar{height:11px;background:#edf3f3;border-radius:99px;overflow:hidden}.progressFill{height:100%;background:#17b9a4;border-radius:99px}.snapPreview{width:100%;max-height:280px;object-fit:cover;border-radius:20px;display:none;margin:10px 0}.noticeAI{background:#fff7d8;border:1px solid #f8e4a1;border-radius:16px;padding:11px;font-size:12px;line-height:1.45;color:#64531f}.recGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.recCard{border:1px solid #e5eeee;border-radius:18px;padding:11px;background:#fff;text-align:left}.recCard .rEmoji{font-size:32px}.miniStatGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.miniStat{background:#f7fbfb;border-radius:18px;padding:14px;text-align:center}.miniStat b{display:block;font-size:24px}.plusCTA{background:linear-gradient(90deg,#ffb02e,#ff7f87);color:white;border:0;border-radius:18px;padding:14px;font-weight:900;width:100%;margin-top:10px}@media(max-width:430px){.plusGridV2,.packGrid,.recGrid{grid-template-columns:1fr 1fr}.plusFeature{padding:13px;min-height:120px}.plusFeature small{font-size:11px}}
</style>
<script>
const PLUS_KEY='playnest_plus_v2';
let plusState;
try{plusState=JSON.parse(localStorage.getItem(PLUS_KEY)||'null')}catch(e){plusState=null}
if(!plusState) plusState={profiles:[{name:(st.profile&&st.profile.name)||'',age:(st.profile&&st.profile.age)||'3-4',interests:(st.profile&&st.profile.interests)||[]}],active:0,challenge:[false,false,false,false,false,false,false],snapTags:[],aiHistory:[]};
function savePlus(){try{localStorage.setItem(PLUS_KEY,JSON.stringify(plusState))}catch(e){}}
function pel(gr,en){return st.lang==='el'?gr:en}
function plusNav(){let ar=[['home','🏠','home'],['week','📅','week'],['favorites','❤️','favorites'],['progress','📊','progress'],['plus','👑','plus']];document.getElementById('nav').innerHTML=ar.map(([v,i,k])=>`<button class="${(v==='plus'?String(st.view).startsWith('plus'):st.view===v)?'active':''}" onclick="st.view='${v}';render()">${i}<span>${tr(k)}</span></button>`).join('')}
function plusGo(v){st.view='plus-'+v;render()}
function plusHead(icon,title,sub=''){return `<div class="plusTop"><button class="plusBack" onclick="st.view='plus';render()">←</button><div><b>${icon} ${title}</b>${sub?`<div class="small">${sub}</div>`:''}</div></div>`}
function personalized(){const pr=plusState.profiles[plusState.active]||plusState.profiles[0]||{};let list=activities.filter(a=>a.premium);if(pr.age) list=list.filter(a=>a.ages?.includes(pr.age));if(pr.interests?.length){const m={vehicle:['travel','active'],animals:['outdoor','learning'],art:['creative'],music:['creative','calm'],building:['stem','creative'],nature:['outdoor'],languages:['learning'],numbers:['learning','stem']};let wanted=pr.interests.flatMap(x=>m[x]||[]);const ranked=list.map(a=>({a,s:(a.tags||[]).filter(t=>wanted.includes(t)).length})).sort((x,y)=>y.s-x.s);list=ranked.map(x=>x.a)}return list.slice(0,4)}
function plus(){let rec=personalized();return `<div class="plusHeroV2"><span class="plusBadge">PLUS</span><h1>👑 PlayNest Plus</h1><p>${pel('Έξυπνες ιδέες, εξατομίκευση και εργαλεία που κάνουν το «τι να παίξουμε;» πανεύκολο.','Smart ideas, personalization and tools that make “what should we play?” effortless.')}</p><button class="plusCTA" onclick="plusGo('ai')">✨ ${pel('Δημιούργησε δραστηριότητα τώρα','Create an activity now')}</button></div><div class="sectionTitle"><h2>${pel('Τα εργαλεία σου','Your tools')}</h2></div><div class="plusGridV2"><button class="plusFeature" onclick="plusGo('snap')"><span class="pfIcon">📸</span><b>Snap & Play</b><small>${pel('Φωτογράφισε ό,τι έχεις και βρες παιχνίδι.','Photograph what you have and find a game.')}</small></button><button class="plusFeature" onclick="plusGo('ai')"><span class="pfIcon">🤖</span><b>PlayNest AI</b><small>${pel('Ιδέες με βάση ηλικία, χρόνο, χώρο και υλικά.','Ideas based on age, time, place and materials.')}</small></button><button class="plusFeature" onclick="plusGo('profiles')"><span class="pfIcon">👶</span><b>${pel('Προφίλ & αδέλφια','Profiles & siblings')}</b><small>${pel('Έως 3 παιδιά και κοινές δραστηριότητες.','Up to 3 children and sibling activities.')}</small></button><button class="plusFeature" onclick="st.view='week';render()"><span class="pfIcon">📅</span><b>${pel('Smart Planner','Smart Planner')}</b><small>${pel('Ισορροπημένο πρόγραμμα 7 ημερών.','Balanced 7-day plan.')}</small></button><button class="plusFeature" onclick="plusGo('packs')"><span class="pfIcon">🧰</span><b>${pel('Premium Packs','Premium Packs')}</b><small>${pel('Ταξίδι, βροχή, STEM, χωρίς οθόνη και άλλα.','Travel, rainy day, STEM, screen-free and more.')}</small></button><button class="plusFeature" onclick="plusGo('challenge')"><span class="pfIcon">🏆</span><b>${pel('7-Day Challenge','7-Day Challenge')}</b><small>${pel('Μία μικρή αποστολή κάθε μέρα.','One small mission every day.')}</small></button><button class="plusFeature" onclick="plusGo('progress')"><span class="pfIcon">📈</span><b>${pel('Advanced Progress','Advanced Progress')}</b><small>${pel('Συνήθειες, ποικιλία και πρόοδος.','Habits, variety and progress.')}</small></button><button class="plusFeature" onclick="plusGo('printables')"><span class="pfIcon">🖨️</span><b>Printables</b><small>${pel('Κάρτες παιχνιδιού και μικρές αποστολές.','Play cards and mini missions.')}</small></button></div><div class="sectionTitle"><h2>✨ ${pel('Για εσάς','For you')}</h2></div><div class="recGrid">${rec.map(a=>`<button class="recCard" onclick="openAct(${a.id})"><div class="rEmoji">${a.emoji}</div><b>${title(a)}</b><div class="small">${a.times[0]}' · ${a.ages.join(', ')}</div></button>`).join('')}</div><div class="plusPanel"><b>${pel('Plus preview ενεργό','Plus preview active')}</b><p class="small">${pel('Οι λειτουργίες της εφαρμογής είναι διαθέσιμες για δοκιμή. Η πραγματική συνδρομή Google Play δεν έχει ενεργοποιηθεί ακόμη.','App features are available for testing. Real Google Play subscription is not enabled yet.')}</p></div>`}
function plusAI(){const pr=plusState.profiles[plusState.active]||{};return `${plusHead('🤖','PlayNest AI',pel('Έξυπνος δημιουργός δραστηριοτήτων','Smart activity creator'))}<div class="plusPanel"><div class="plusForm"><label>${pel('Ηλικία','Age')}<select id="paiAge">${['1-2','2-3','3-4','4-6','6-8'].map(x=>`<option ${x===(pr.age||'3-4')?'selected':''}>${x}</option>`).join('')}</select></label><label>${pel('Χρόνος','Time')}<select id="paiTime"><option value="15">15 ${pel('λεπτά','min')}</option><option value="30">30 ${pel('λεπτά','min')}</option><option value="60">60 ${pel('λεπτά','min')}</option></select></label><label>${pel('Πού βρίσκεστε;','Where are you?')}<select id="paiPlace"><option value="home">🏠 ${pel('Σπίτι','Home')}</option><option value="outside">🌳 ${pel('Έξω','Outside')}</option><option value="car">🚗 ${pel('Αυτοκίνητο','Car')}</option><option value="restaurant">🍽️ ${pel('Εστιατόριο','Restaurant')}</option></select></label><label>${pel('Τι διάθεση θέλεις;','What kind of activity?')}<select id="paiType"><option value="all">✨ ${pel('Οτιδήποτε','Anything')}</option><option value="creative">🎨 ${pel('Δημιουργική','Creative')}</option><option value="learning">🧠 ${pel('Μάθηση','Learning')}</option><option value="movement">🏃 ${pel('Κίνηση','Active')}</option><option value="calm">😌 ${pel('Ήρεμη','Calm')}</option></select></label><label>${pel('Υλικά που έχεις (προαιρετικά)','Materials you have (optional)')}<textarea id="paiMaterials" placeholder="${pel('π.χ. χαρτί, μαρκαδόροι, κουτί','e.g. paper, markers, box')}"></textarea></label><button class="primary" onclick="generatePlusAI()">✨ ${pel('Δημιούργησέ το','Create it')}</button></div><div id="paiResult"></div></div>`}
function generatePlusAI(){let age=document.getElementById('paiAge').value,time=document.getElementById('paiTime').value,place=document.getElementById('paiPlace').value,type=document.getElementById('paiType').value,mats=document.getElementById('paiMaterials').value.trim();let pool=activities.filter(a=>a.ages?.includes(age)&&a.times?.includes(time)&&(a.places?.includes(place)||place==='home'&&a.places?.includes('home'))&&(type==='all'||a.types?.includes(type)));if(!pool.length)pool=activities.filter(a=>a.ages?.includes(age)&&(type==='all'||a.types?.includes(type)));if(!pool.length)pool=activities;let a=pool[Math.floor(Math.random()*pool.length)];plusState.aiHistory.unshift(a.id);plusState.aiHistory=plusState.aiHistory.slice(0,10);savePlus();document.getElementById('paiResult').innerHTML=`<div class="resultCard"><div class="bigEmoji">${a.emoji}</div><span class="plusBadge">${a.premium?'PLUS':'SMART PICK'}</span><h2>${title(a)}</h2><p>${desc(a)}</p>${mats?`<p class="small"><b>${pel('Με βάση όσα έχεις:','Using what you have:')}</b> ${mats}</p>`:''}<button class="primary" onclick="openAct(${a.id})">${pel('Άνοιξε τη δραστηριότητα','Open activity')}</button><button class="soft" style="width:100%;margin-top:8px" onclick="generatePlusAI()">🔄 ${pel('Άλλη ιδέα','Another idea')}</button></div>`}
function plusSnap(){return `${plusHead('📸','Snap & Play',pel('Φωτογραφία → ιδέες παιχνιδιού','Photo → play ideas'))}<div class="plusPanel"><p>${pel('Βγάλε ή διάλεξε φωτογραφία με τα αντικείμενα που έχεις διαθέσιμα.','Take or choose a photo of the objects you have available.')}</p><input id="snapFile" type="file" accept="image/*" capture="environment" onchange="snapPreviewFile(this)" style="width:100%"><img id="snapImg" class="snapPreview"><div class="noticeAI" style="margin-top:10px">🤖 ${pel('Στην έκδοση δοκιμής επιλέγεις τα υλικά που βλέπεις στη φωτογραφία. Η αυτόματη αναγνώριση εικόνας θα συνδεθεί με AI Vision στην παραγωγική έκδοση.','In this test version you select the materials visible in the photo. Automatic image recognition will be connected to AI Vision in the production version.')}</div><h3 style="margin-top:16px">${pel('Τι βλέπεις στη φωτογραφία;','What is in the photo?')}</h3><div class="plusChips" id="snapChips">${[['📦','box'],['📄','paper'],['🖍️','markers'],['🥤','cups'],['🚗','cars'],['🧱','blocks'],['🧸','toys'],['🥄','spoons'],['🧵','string'],['🍃','nature']].map(([ic,k])=>`<button class="plusChip ${plusState.snapTags.includes(k)?'on':''}" onclick="toggleSnap('${k}',this)">${ic} ${pel({box:'Κουτί',paper:'Χαρτί',markers:'Μαρκαδόροι',cups:'Ποτήρια',cars:'Αυτοκινητάκια',blocks:'Τουβλάκια',toys:'Παιχνίδια',spoons:'Κουτάλια',string:'Σπάγκος',nature:'Φύλλα/πέτρες'}[k],{box:'Box',paper:'Paper',markers:'Markers',cups:'Cups',cars:'Toy cars',blocks:'Blocks',toys:'Toys',spoons:'Spoons',string:'String',nature:'Leaves/stones'}[k])}</button>`).join('')}</div><button class="primary" style="margin-top:14px" onclick="snapSuggest()">✨ ${pel('Βρες παιχνίδια','Find games')}</button><div id="snapResults"></div></div>`}
function snapPreviewFile(inp){let f=inp.files&&inp.files[0];if(!f)return;let img=document.getElementById('snapImg');img.src=URL.createObjectURL(f);img.style.display='block'}
function toggleSnap(k,b){plusState.snapTags.includes(k)?plusState.snapTags=plusState.snapTags.filter(x=>x!==k):plusState.snapTags.push(k);b.classList.toggle('on');savePlus()}
function snapSuggest(){let map={box:['creative','stem'],paper:['creative','learning'],markers:['creative'],cups:['movement','stem'],cars:['movement','travel'],blocks:['stem','creative'],toys:['creative'],spoons:['movement','learning'],string:['creative','movement'],nature:['outdoor','learning']};let types=plusState.snapTags.flatMap(x=>map[x]||[]);let pool=activities.filter(a=>types.some(t=>a.types?.includes(t)||a.tags?.includes(t)));if(!pool.length)pool=activities.filter(a=>a.premium);pool=pool.sort(()=>Math.random()-.5).slice(0,3);document.getElementById('snapResults').innerHTML=`<div class="sectionTitle"><h2>${pel('3 ιδέες τώρα','3 ideas now')}</h2></div>${pool.map(a=>`<div class="resultCard" onclick="openAct(${a.id})"><b>${a.emoji} ${title(a)}</b><div class="small">${a.times[0]}' · ${a.ages.join(', ')}</div></div>`).join('')}`}
function plusProfiles(){return `${plusHead('👶',pel('Προφίλ & αδέλφια','Profiles & siblings'),pel('Έως 3 παιδικά προφίλ','Up to 3 child profiles'))}<div class="plusPanel"><div id="profileListV2">${plusState.profiles.map((p,i)=>`<div class="profileRow ${i===plusState.active?'active':''}"><div class="profileAvatar">${['🧒','👧','👦'][i]||'🧒'}</div><div><b>${p.name||pel('Παιδί '+(i+1),'Child '+(i+1))}</b><div class="small">${p.age} · ${(p.interests||[]).length} ${pel('ενδιαφέροντα','interests')}</div></div><button class="soft" onclick="setActiveProfile(${i})">${i===plusState.active?'✓':pel('Επιλογή','Select')}</button></div>`).join('')}</div>${plusState.profiles.length<3?`<button class="primary" onclick="addPlusProfile()">＋ ${pel('Προσθήκη παιδιού','Add child')}</button>`:''}</div><div class="plusPanel"><h3>👫 ${pel('Sibling Mode','Sibling Mode')}</h3><p class="small">${pel('Βρες δραστηριότητες που μπορούν να κάνουν μαζί δύο παιδιά διαφορετικών ηλικιών.','Find activities two children of different ages can enjoy together.')}</p><div class="plusForm"><label>${pel('Ηλικία 1','Age 1')}<select id="sib1">${['1-2','2-3','3-4','4-6','6-8'].map(x=>`<option>${x}</option>`).join('')}</select></label><label>${pel('Ηλικία 2','Age 2')}<select id="sib2">${['1-2','2-3','3-4','4-6','6-8'].map(x=>`<option ${x==='4-6'?'selected':''}>${x}</option>`).join('')}</select></label><button class="primary" onclick="siblingSuggest()">✨ ${pel('Βρες κοινή δραστηριότητα','Find shared activity')}</button></div><div id="sibResult"></div></div>`}
function addPlusProfile(){let name=prompt(pel('Όνομα ή ψευδώνυμο','Name or nickname'))||'';let age=prompt(pel('Ηλικία: 1-2, 2-3, 3-4, 4-6 ή 6-8','Age: 1-2, 2-3, 3-4, 4-6 or 6-8'),'3-4')||'3-4';if(!['1-2','2-3','3-4','4-6','6-8'].includes(age))age='3-4';plusState.profiles.push({name,age,interests:[]});savePlus();render()}
function setActiveProfile(i){plusState.active=i;let p=plusState.profiles[i];st.profile.name=p.name;st.profile.age=p.age;st.profile.interests=p.interests||[];savePlus();save();render()}
function siblingSuggest(){let a1=document.getElementById('sib1').value,a2=document.getElementById('sib2').value;let pool=activities.filter(a=>a.ages?.includes(a1)&&a.ages?.includes(a2));if(!pool.length)pool=activities.filter(a=>a.ages?.includes(a1)||a.ages?.includes(a2));let a=pool[Math.floor(Math.random()*pool.length)];document.getElementById('sibResult').innerHTML=`<div class="resultCard"><div class="bigEmoji">${a.emoji}</div><h3>${title(a)}</h3><p>${desc(a)}</p><button class="primary" onclick="openAct(${a.id})">${pel('Άνοιξε','Open')}</button></div>`}
const plusPacks=[['screenfree','📵','Screen-Free'],['stem','🔬','STEM'],['travel','🚗',pel('Ταξίδι','Travel')],['rainy','🌧️',pel('Βροχερή μέρα','Rainy Day')],['outdoor','🌳',pel('Έξω','Outdoor')],['toddler','🧸',pel('Νήπια','Toddler')],['family','👨‍👩‍👧',pel('Οικογένεια','Family')],['calm','🌙',pel('Ήρεμες','Calm')]];
function plusPacksPage(){return `${plusHead('🧰',pel('Premium Packs','Premium Packs'),pel('Έτοιμες συλλογές για κάθε στιγμή','Ready-made collections for every moment'))}<div class="packGrid">${plusPacks.map(([tag,ic,n])=>`<button class="pack" onclick="openPack('${tag}')"><span style="font-size:32px">${ic}</span><b>${n}</b><small>${activities.filter(a=>a.premium&&(a.tags||[]).includes(tag)).length} ${pel('δραστηριότητες','activities')}</small></button>`).join('')}</div>`}
function openPack(tag){exCategory=tag;openExplore()}
function plusChallenge(){let done=plusState.challenge.filter(Boolean).length;let picks=activities.filter(a=>a.premium).slice(0,7);return `${plusHead('🏆','7-Day Challenge',pel('7 μέρες • 7 μικρές αποστολές','7 days • 7 mini missions'))}<div class="plusPanel"><div class="row between"><b>${done}/7 ${pel('ολοκληρώθηκαν','completed')}</b><span>${Math.round(done/7*100)}%</span></div><div class="progressBar" style="margin:10px 0 14px"><div class="progressFill" style="width:${done/7*100}%"></div></div>${picks.map((a,i)=>`<div class="challengeDay"><div style="font-size:28px">${a.emoji}</div><div onclick="openAct(${a.id})"><b>${pel('Μέρα','Day')} ${i+1}: ${title(a)}</b><div class="small">${a.times[0]}'</div></div><button class="iconbtn" onclick="toggleChallenge(${i})">${plusState.challenge[i]?'✅':'⬜'}</button></div>`).join('')}</div>`}
function toggleChallenge(i){plusState.challenge[i]=!plusState.challenge[i];savePlus();render()}
function plusProgress(){let completed=st.done?.length||0,favs=st.favs?.length||0,ch=plusState.challenge.filter(Boolean).length,ai=plusState.aiHistory.length;let variety=new Set((st.week||[]).map(id=>activities.find(a=>a.id===id)?.types?.[0]).filter(Boolean)).size;return `${plusHead('📈',pel('Advanced Progress','Advanced Progress'),pel('Μικρή εικόνα των συνηθειών παιχνιδιού','A snapshot of play habits'))}<div class="miniStatGrid"><div class="miniStat"><b>${completed}</b><span>${pel('ολοκληρωμένες','completed')}</span></div><div class="miniStat"><b>${favs}</b><span>${pel('αγαπημένες','favorites')}</span></div><div class="miniStat"><b>${ch}/7</b><span>challenge</span></div><div class="miniStat"><b>${ai}</b><span>smart picks</span></div></div><div class="plusPanel"><h3>🌈 ${pel('Ποικιλία εβδομάδας','Weekly variety')}</h3><div class="progressBar"><div class="progressFill" style="width:${Math.min(100,variety*25)}%"></div></div><p class="small">${pel('Στόχος: δημιουργική, μαθησιακή, κινητική και ήρεμη δραστηριότητα μέσα στην εβδομάδα.','Goal: creative, learning, active and calm activity during the week.')}</p></div><div class="plusPanel"><h3>🔥 ${pel('Συνέπεια','Consistency')}</h3><p>${completed+ch>=5?'🔥🔥🔥':completed+ch>=2?'🔥🔥':'🔥'} ${pel('Συνέχισε έτσι! Κάθε μικρή δραστηριότητα μετράει.','Keep going! Every small activity counts.')}</p></div>`}
function plusPrintables(){let cards=activities.filter(a=>a.premium&&a.tags?.includes('screenfree')).slice(0,6);return `${plusHead('🖨️','Printables',pel('Κάρτες δραστηριοτήτων για εκτύπωση ή screenshot','Activity cards for printing or screenshot'))}<div class="plusPanel"><p class="small">${pel('Άνοιξε μια κάρτα και κράτησέ την ως screenshot ή χρησιμοποίησε την εκτύπωση του κινητού/υπολογιστή.','Open a card and save it as a screenshot or use your phone/computer print option.')}</p></div><div class="recGrid">${cards.map(a=>`<button class="recCard" onclick="openAct(${a.id})"><div class="rEmoji">${a.emoji}</div><b>${title(a)}</b><div class="small">${a.times[0]}' · ${pel('χωρίς οθόνη','screen-free')}</div></button>`).join('')}</div>`}
render = function(){document.documentElement.lang=st.lang;langBtn.textContent='🌐 '+(st.lang==='el'?'ΕΛ':'EN');plusNav();let out;switch(st.view){case'home':out=home();break;case'week':out=week();break;case'favorites':out=favorites();break;case'progress':out=progress();break;case'plus':out=plus();break;case'profile':out=profile();break;case'plus-ai':out=plusAI();break;case'plus-snap':out=plusSnap();break;case'plus-profiles':out=plusProfiles();break;case'plus-packs':out=plusPacksPage();break;case'plus-challenge':out=plusChallenge();break;case'plus-progress':out=plusProgress();break;case'plus-printables':out=plusPrintables();break;default:out=act()}document.getElementById('main').innerHTML=out;try{window.scrollTo(0,0)}catch(e){}}
</script>

</body>
